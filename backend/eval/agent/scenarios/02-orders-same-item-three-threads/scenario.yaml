id: 02-orders-same-item-three-threads
prompt: "Track my online orders - what I ordered, from which shop, and where each delivery is at."
steps:
- name: build
  now: 2026-11-02T09:00:00Z
  expect:
    - {kind: unique, all_of: ["Oakline"]}
    - {kind: unique, all_of: ["55817"]}
    - {kind: value, find: ["Oakline"], any_of: ["transit", "shipped", "dispatched", "delay", "on its way", "out for", "rescheduled", "3 Nov", "Nov 3", "2026-11-03"]}
    - {kind: unique, all_of: ["Shutterbay"]}
    - {kind: unique, all_of: ["90314"]}
    - {kind: value, find: ["Shutterbay"], any_of: ["transit", "shipped", "on its way", "dispatched", "4 Nov", "Nov 4", "2026-11-04"]}
    - {kind: value, find: ["PO-66120"], any_of: ["return", "refund"]}
    - {kind: value, find: ["CC-118204"], any_of: ["backorder", "back order", "back-order", "delayed", "23 Nov", "Nov 23", "2026-11-23"]}
    - {kind: absent, any_of: ["Autumn sale", "Lens of the month", "TeleNova", "56mm"]}
    - {kind: count, min: 9, max: 11}
    - {kind: app_shows, any_of: ["Oakline"]}
- name: sync-1
  now: 2026-11-05T09:00:00Z
  expect:
    - {kind: unique, all_of: ["Oakline"]}
    - {kind: value, find: ["Oakline"], any_of: ["delivered"]}
    - {kind: unique, all_of: ["Shutterbay"]}
    - {kind: value, find: ["Shutterbay"], any_of: ["delivered"]}
    - {kind: unchanged_except, find: [["Oakline"], ["Shutterbay"]]}
    - {kind: count, min: 9, max: 11}
- name: sync-2
  now: 2026-11-08T09:00:00Z
  expect:
    - {kind: unique, all_of: ["Oakline"]}
    - {kind: unique, all_of: ["KL-4418"]}
    - {kind: value, find: ["KL-4418"], any_of: ["shipped", "transit", "dispatched", "on its way"]}
    - {kind: unchanged_except, find: [["KL-4418"], ["Oakline"]]}
    - {kind: absent, any_of: ["10% off"]}
    - {kind: count, min: 9, max: 11}
