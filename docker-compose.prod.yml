# Production-like stack: Postgres + backend API + worker + frontend, no bind mounts,
# no reload, non-root containers, restart on failure.
#   make prod-up    → build and start
#   make prod-down  → stop (keeps the `pgdata_prod` volume)
#
# Reads the repo-root .env (or an env file you point at with `--env-file`). For a real
# deployment set at least (ENV is forced to prod, so session cookies are Secure: serve
# over HTTPS, or http://localhost when testing on your machine):
#   FRONTEND_URL=https://app.example.com
#   BACKEND_URL=https://api.example.com       (+ add <BACKEND_URL>/api/v1/auth/google/callback
#                                               as a redirect URI in Google Cloud)
#   NEXT_PUBLIC_API_URL=https://api.example.com   (baked into the frontend at build time)
#   AUTH_COOKIE_DOMAIN=example.com             (so the API receives the login cookie)
#   SMTP_HOST / SMTP_USER / SMTP_PASSWORD      (sends sign-up codes from EMAIL_FROM)
#   POSTGRES_PASSWORD=<strong password>
# and put an HTTPS reverse proxy (Caddy, nginx, your platform's load balancer) in front of
# ports 3000 and 8000. Frontend and backend must be on the same site (e.g. subdomains of
# one domain) for the SameSite=Lax session cookie to be sent.

x-backend: &backend
  build:
    context: ./backend
    target: prod
  image: demux-backend:prod
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-demux}:${POSTGRES_PASSWORD:-demux}@postgres:5432/${POSTGRES_DB:-demux}
    ENV: prod
  init: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demux}
      POSTGRES_DB: ${POSTGRES_DB:-demux}
    # Not published: only reachable inside the compose network.
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    <<: *backend
    command: >
      sh -c "alembic upgrade head &&
      exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips '*'"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: demux-frontend:prod
    env_file: .env
    environment:
      # Login (better-auth) talks to Postgres directly; tables come from the backend's
      # migrations, which is why it waits for a healthy backend. Set SMTP_* in .env:
      # without them sign-up codes cannot be sent in production.
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER:-demux}:${POSTGRES_PASSWORD:-demux}@postgres:5432/${POSTGRES_DB:-demux}
      BETTER_AUTH_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata_prod:
